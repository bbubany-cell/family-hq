<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13213a"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="iq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Level up: three steps climbing, gold on top -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="34">
    <path d="M150 232 L256 160 L362 232" stroke="#2f81f7" opacity="0.5"/>
    <path d="M150 170 L256 98 L362 170" stroke="#2f81f7"/>
    <path d="M150 108 L256 36 L362 108" stroke="#ffd60a"/>
  </g>
  <!-- IQ -->
  <text x="256" y="452" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-weight="900" font-size="210" letter-spacing="-6" fill="url(#iq)">IQ</text>
</svg>
